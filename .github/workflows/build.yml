name: Build plugin

# GitHub Actions esta DESHABILITADO en este repositorio por decision del
# propietario. Este workflow queda documentado y listo para una habilitacion
# explicita; no se ha ejecutado.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "HDrama/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Test
        run: ./gradlew :HDrama:testDebugUnitTest

      - name: Build .cs3
        run: ./gradlew :HDrama:make makePluginsJson

      - name: Publish to builds branch
        run: |
          mkdir -p out
          cp HDrama/build/HDrama.cs3 out/
          cp build/plugins.json out/
          cp repo.json out/
          cd out
          git init
          git checkout -b builds
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "build: HDrama $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin builds
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
